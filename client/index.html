<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>醫學大富翁 - 多人遊戲</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f7f6; }
        #game-container { max-width: 800px; margin: 50px auto; padding: 20px; border: 2px solid #007bff; border-radius: 10px; background: white; }
        .player-info { border-bottom: 1px dashed #ccc; padding: 10px 0; }
        .board-status { margin-top: 20px; font-weight: bold; color: #28a745; }
    </style>
</head>
<body>
    <div id="question-area" style="display: none; border: 1px solid #ccc; padding: 15px; margin-top: 20px;">
    <h3>醫學問答挑戰！</h3>
    <p id="question-text"></p>
    <div id="options-container">
        </div>
    <button id="submit-answer-btn" disabled>提交答案</button>
    </div>

    <script>
    // ******************************************************
// 請替換這裡的 URL 為您 Render 伺服器的公開網址
// ******************************************************
// 請貼上您猜測或認為最像的網址，例如：
const SERVER_URL = 'https://medical-monopoly-server-test-1234.onrender.com'; 

let socket;
let playerName = '';

// 1. 連線到後端伺服器
function connectServer() {
    try {
        socket = io(SERVER_URL);
        document.getElementById('status').textContent = '已連線 (等待加入)';

        socket.on('connect', () => {
            document.getElementById('status').textContent = '連線成功';
            document.getElementById('join-button').disabled = false;
        });

        socket.on('disconnect', () => {
            document.getElementById('status').textContent = '已斷線';
            document.getElementById('roll-button').disabled = true;
        });

        // 接收伺服器更新的狀態
        socket.on('gameStateUpdate', (gameState) => {
            updateGameView(gameState);
        });

        // 接收骰子結果
        socket.on('diceRolled', (data) => {
            // 注意：這裡需要 gameState 變數來存取玩家名稱
            const mover = gameState.players[data.playerID] ? gameState.players[data.playerID].name : '一位玩家';
            document.getElementById('board-status').textContent = 
                `${mover} 丟出了 ${data.result} 點，目前位於第 ${gameState.players[data.playerID].position} 格！`;
        });
        
    } catch (e) {
        document.getElementById('status').textContent = '連線失敗，請檢查網址或伺服器是否運行。';
        // *** 這裡會顯示嘗試連線的網址！ ***
        console.error('Socket連線錯誤:', e);
    }
}

// 2. 加入遊戲
function joinGame() {
    playerName = prompt("請輸入您的醫學生姓名:");
    if (playerName) {
        socket.emit('joinGame', playerName);
        document.getElementById('player-name-display').textContent = playerName;
        document.getElementById('join-button').disabled = true;
        document.getElementById('roll-button').disabled = false;
    }
}

// 3. 丟骰子
function rollDice() {
    socket.emit('rollDice');
}

// 4. 更新遊戲畫面
let gameState;
function updateGameView(newState) {
    gameState = newState;
    const playerListDiv = document.getElementById('player-list');
    playerListDiv.innerHTML = '';

    const selfData = Object.values(gameState.players).find(p => p.id === socket.id);
    if (selfData) {
        document.getElementById('player-money').textContent = `$${selfData.money} (位置: ${selfData.position})`;
    }

    Object.values(gameState.players).forEach(player => {
        const info = document.createElement('div');
        info.className = 'player-info';
        info.textContent = `[${player.name}] - $${player.money} - 位置: ${player.position} ${player.id === socket.id ? '(您)' : ''}`;
        playerListDiv.appendChild(info);
    });
}

// 啟動連線
connectServer();

</script>
</body>
</html>
